# Smithery configuration — https://smithery.ai/docs
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      x402PrivateKey:
        type: string
        description: >-
          Optional. Private key of a wallet holding a little USDC on Base
          mainnet — enables the paid tools ($0.01–$1.50/call). Free tools
          (catalog, free_samples) work without it. Use a dedicated
          low-balance wallet, never your main one.
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['index.js'],
      env: config.x402PrivateKey ? { X402_PRIVATE_KEY: config.x402PrivateKey } : {}
    })
